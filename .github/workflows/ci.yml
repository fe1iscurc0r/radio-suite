# 三平台 matrix：Linux headless（BUILD_GUI=OFF，零 Qt）/ Windows MSVC+Qt / macOS Qt
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} (gui=${{ matrix.build_gui }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_gui: OFF
          - os: windows-latest
            build_gui: ON
          - os: macos-latest
            build_gui: ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Windows)
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install Qt (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=${{ matrix.build_gui }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
